apiVersion: apps/v1
kind: Deployment

metadata:
  name: grocery-app
  namespace: grocery
  labels:
    app: grocery-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: grocery-app

  template:
    metadata:
      labels:
        app: grocery-app

    spec:
      containers:
        - name: grocery-app

          image: dockerized-grocery-store-web:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 80

          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: grocery-config
                  key: DB_HOST

            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: grocery-config
                  key: DB_NAME

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: grocery-secret
                  key: MYSQL_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grocery-secret
                  key: MYSQL_PASSWORD

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
